[workspace]
members = ["svc", "svc-ipc"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Portero VPN"]
license = "Apache-2.0"

[package]
name = "portero-vpn"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Cliente OpenVPN con comprobaciones de seguridad previas a la conexion"

[[bin]]
name = "portero-vpn"
path = "src/main.rs"

[dependencies]
svc-ipc = { path = "svc-ipc" }

eframe = { version = "0.29", features = ["wgpu"] }
egui = "0.29"
rfd = "0.15"

tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "process", "sync", "io-util", "macros"] }
async-trait = "0.1"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

wmi = "0.14"

windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Security_Authorization",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
    "Win32_System_Registry",
    "Win32_Globalization",
] }
windows-service = "0.7"

argon2 = { version = "0.5", features = ["std"] }
password-hash = { version = "0.5", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["std"] }

uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

thiserror = "1"
tray-icon = { version = "0.24.2", default-features = false }
raw-window-handle = "0.6.2"
pollster = "1.0.1"
pgp = "0.20.0"
ureq = "3.4.0"

[dev-dependencies]
tempfile = "3"
# Solo para tests: reloj virtual de tokio, para poder probar politicas de
# reintento con `sleep` de por medio (ver checks::tests) sin esperas reales.
tokio = { version = "1", features = ["test-util"] }

[profile.release]
opt-level = 2

[build-dependencies]
ico = "0.5.0"
winresource = { version = "0.1.31", default-features = false }

# Copia local de egui-wgpu 0.29.1 (ver vendor/egui-wgpu-0.29.1) con un
# reintento: si la primera peticion de adaptador wgpu no encuentra nada
# (visto en la practica en una VM sin Vulkan/DirectX con GPU real ni WARP
# descubierto a la primera), se reintenta forzando
# `force_fallback_adapter: true` antes de rendirse. Esta version de
# eframe/egui-wgpu no expone esa opcion en su API publica, asi que no hay
# forma de conseguir este comportamiento sin tocar el propio codigo fuente.
[patch.crates-io]
egui-wgpu = { path = "vendor/egui-wgpu-0.29.1" }
